# Keep the full IDE SDK build within a small GitLab runner memory budget.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.jetbrains.intellij.platform.downloadSources=false
# PhpStorm provides its own compatible Kotlin stdlib.
kotlin.stdlib.default.dependency=false
