# The PhpStorm SDK compiler requires >256 MiB of Metaspace. Keep Gradle and
# the forked JetBrains test JVM below the Kubernetes runner 2 GiB memory limit.
org.gradle.jvmargs=-Xmx448m -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.jetbrains.intellij.platform.downloadSources=false
# PhpStorm provides its own compatible Kotlin stdlib.
kotlin.stdlib.default.dependency=false
