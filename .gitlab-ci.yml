stages:
  - quality
  - tests
  - build
  - deploy
  - release

default:
  image: composer:2
  before_script:
    - composer install --prefer-dist --no-interaction --no-progress

quality:
  stage: quality
  script:
    - php bin/self-test
    - find src tests bin -type f \( -name '*.php' -o -name 'sem-ide' -o -name 'self-test' \) -exec php -l {} \;
    - vendor/bin/phpstan analyse --no-progress
    - php bin/apply-copyright.php --check
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

phpstorm_build:
  image: gradle:9.2.1-jdk21
  stage: build
  before_script: []
  interruptible: true
  resource_group: phpstorm-build
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-user-home"
  script:
    - df -h .
    - cd phpstorm
    - gradle --no-daemon --max-workers=1 --console=plain --stacktrace test buildPlugin
    - ls -lh build/distributions/*.zip
    - jar tf build/libs/*.jar | grep -F 'META-INF/plugin.xml'
    - jar tf build/libs/*.jar | grep -F 'dev/smallproject/ide/SmallCompletionContributor.class'
    - jar tf build/distributions/*.zip | grep -F 'small-entity-manager/lib/'
  artifacts:
    when: always
    paths:
      - phpstorm/build/distributions/*.zip
      - phpstorm/build/test-results/test/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

tests:
  stage: tests
  script:
    - vendor/bin/pest --testsuite=Unit
    - vendor/bin/pest --testsuite=Functional
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

build:
  stage: build
  script:
    - mkdir -p dist
    - tar --exclude=vendor --exclude=dist --exclude=.git -czf "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz" .
  artifacts:
    paths: [dist/]
  rules:
    - if: '$CI_COMMIT_TAG'

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: phpstorm_build
      artifacts: true
  before_script: []
  script:
    - 'test -f "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"'
    - 'test -f "phpstorm/build/distributions/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"'
    - >-
      curl --fail --show-error --retry 3
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-ide-core/${CI_COMMIT_TAG}/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"
    - >-
      curl --fail --show-error --retry 3
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "phpstorm/build/distributions/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-phpstorm/${CI_COMMIT_TAG}/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"
  rules:
    - if: '$CI_COMMIT_TAG'

gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  needs:
    - job: deploy
      artifacts: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - 'echo "Creating GitLab Release ${CI_COMMIT_TAG}"'
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Small Entity Manager IDE ${CI_COMMIT_TAG}'
    description: 'Automatic release for ${CI_COMMIT_TAG}. Assets are published in the GitLab Generic Package Registry after all quality, test and build jobs succeed.'
    assets:
      links:
        - name: 'PhpStorm plugin (.zip)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-phpstorm/${CI_COMMIT_TAG}/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip'
          link_type: package
        - name: 'IDE Core sources (.tar.gz)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-ide-core/${CI_COMMIT_TAG}/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG'
