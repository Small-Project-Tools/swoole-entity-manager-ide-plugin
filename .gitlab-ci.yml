stages:
  - release

publish_rc4_tag:
  image: alpine:3.20
  stage: release
  before_script:
    - apk add --no-cache git curl ca-certificates
  script:
    - |
      set -eu
      test "$CI_COMMIT_BRANCH" = "release/1.0.0-rc4"
      expected="bf0e13b04ac78b6442c35c00a0746ce135eaab8f"
      actual="$(git ls-remote origin refs/heads/main | cut -f1)"
      if [ "$actual" != "$expected" ]; then
        echo "main moved: refusing to publish an unreviewed commit" >&2
        exit 1
      fi
      if git ls-remote origin refs/tags/1.0.0-RC4 | grep -q .; then
        echo "Tag 1.0.0-RC4 already exists: refusing to overwrite" >&2
        exit 1
      fi
      payload="$(printf '{"tag_name":"1.0.0-RC4","ref":"%s","tag_message":"release: 1.0.0-RC4","name":"Small Entity Manager IDE 1.0.0-RC4","description":"Automatic release for 1.0.0-RC4. Package assets are attached by the tag pipeline."}' "$expected")"
      status="$(curl --silent --show-error --output /tmp/rc4-release-response.json --write-out '%{http_code}' --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header 'Content-Type: application/json' --data "$payload" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")"
      if [ "$status" != "201" ]; then
        echo "Release creation returned HTTP $status" >&2
        cat /tmp/rc4-release-response.json >&2
        exit 1
      fi
      echo "Annotated tag 1.0.0-RC4 and release created at $expected"
      git ls-remote --tags origin refs/tags/1.0.0-RC4
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/1.0.0-rc4"'
