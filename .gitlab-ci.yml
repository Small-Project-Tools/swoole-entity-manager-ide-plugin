workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - quality
  - tests
  - build
  - deploy
  - release

default:
  image: composer:2
  interruptible: true
  before_script:
    - composer install --prefer-dist --no-interaction --no-progress

quality:
  stage: quality
  script:
    - php bin/self-test
    - find src tests bin -type f \( -name '*.php' -o -name 'sem-ide' -o -name 'self-test' \) -exec php -l {} \;
    - vendor/bin/phpstan analyse --no-progress
    - php bin/apply-copyright.php --check
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

phpstorm_build:
  image: gradle:9.2.1-jdk21
  timeout: 35m
  stage: build
  before_script: []
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-user-home"
  resource_group: phpstorm-sdk-build
  script:
    - df -h .
    - cd phpstorm
    # Keep Kotlin compilation and JetBrains PSI tests in separate Gradle JVMs:
    # running them together can exceed a 2 GiB Kubernetes runner memory limit.
    # Bound both phases to prevent a stalled IDE test from blocking the runner.
    - timeout --signal=TERM --kill-after=30s 16m gradle --no-daemon --max-workers=1 --console=plain --stacktrace verifyPluginConfiguration compileKotlin compileTestKotlin
    - timeout --signal=TERM --kill-after=30s 16m gradle --no-daemon --max-workers=1 --console=plain --stacktrace test buildPlugin verifyPluginStructure
    - ls -lh build/distributions/*.zip
    - jar tf build/libs/*-base.jar | grep -F 'META-INF/plugin.xml'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/SmallCompletionContributor.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/PhpStringInsertion.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/SmallPhpTypeProvider.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/NativePhpIndexer.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/NativeIndexSnapshotCache.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/SmallProjectIndexStartup.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/PhpExecutableSourceMask.class'
    - jar tf build/libs/*-base.jar | grep -F 'dev/smallproject/ide/ProjectCoverageAudit.class'
    - 'test "$(grep -R -o "<testcase " build/test-results/test --include="TEST-*.xml" | wc -l)" -ge 600'
    - jar tf build/distributions/*.zip | grep -E '/lib/[^/]+[.]jar$'
    - '! jar tf build/distributions/*.zip | grep -F "core/bin/sem-ide"'
    # Test the actual ZIP a user installs; source archives have no plugin.xml.
    - mkdir -p build/zip-verification
    - '(cd build/zip-verification && jar xf ../distributions/*.zip)'
    - 'test "$(find build/zip-verification -type f -name "small-entity-manager-phpstorm-*.jar" | wc -l)" -eq 1'
    - 'jar tf "$(find build/zip-verification -type f -name "small-entity-manager-phpstorm-*.jar" -print -quit)" | grep -Fx "META-INF/plugin.xml"'
    - 'jar tf "$(find build/zip-verification -type f -name "small-entity-manager-phpstorm-*.jar" -print -quit)" | grep -Fx "dev/smallproject/ide/SemManagerAccessorInference.class"'
  after_script:
    - |
      for metric in memory.current memory.peak memory.events; do
        if [ -r "/sys/fs/cgroup/$metric" ]; then
          printf 'Cgroup %s:\\n' "$metric"
          cat "/sys/fs/cgroup/$metric"
        fi
      done
  artifacts:
    when: always
    paths:
      - phpstorm/build/distributions/*.zip
      - phpstorm/build/test-results/test/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

unit_tests:
  stage: tests
  script:
    - mkdir -p build/test-results
    - vendor/bin/pest --testsuite=Unit --log-junit build/test-results/unit.xml
  artifacts:
    when: always
    paths:
      - build/test-results/
    reports:
      junit: build/test-results/unit.xml
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

functional_tests:
  stage: tests
  script:
    - mkdir -p build/test-results
    - vendor/bin/pest --testsuite=Functional --log-junit build/test-results/functional.xml
  artifacts:
    when: always
    paths:
      - build/test-results/
    reports:
      junit: build/test-results/functional.xml
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

build:
  stage: build
  script:
    - mkdir -p dist
    - tar --exclude=vendor --exclude=dist --exclude=.git -czf "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz" .
  artifacts:
    paths: [dist/]
  rules:
    - if: '$CI_COMMIT_TAG'

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: phpstorm_build
      artifacts: true
    - job: vscode_build
      artifacts: true
  before_script: []
  script:
    - 'test -f "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"'
    - 'test -f "phpstorm/build/distributions/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"'
    - 'test -f "vscode/small-entity-manager-vscode-${CI_COMMIT_TAG}.vsix"'
    - >-
      curl --fail --show-error --retry 3
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "dist/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-ide-core/${CI_COMMIT_TAG}/small-entity-manager-ide-core-${CI_COMMIT_TAG}.tar.gz"
    - >-
      curl --fail --show-error --retry 3
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "phpstorm/build/distributions/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-phpstorm/${CI_COMMIT_TAG}/small-entity-manager-phpstorm-${CI_COMMIT_TAG}.zip"
    - >-
      curl --fail --show-error --retry 3
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "vscode/small-entity-manager-vscode-${CI_COMMIT_TAG}.vsix"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/small-entity-manager-vscode/${CI_COMMIT_TAG}/small-entity-manager-vscode-${CI_COMMIT_TAG}.vsix"
  rules:
    - if: '$CI_COMMIT_TAG'

gitlab_release:
  stage: release
  image: composer:2
  before_script: []
  needs:
    - job: deploy
      artifacts: false
  script:
    - php bin/publish-release.php
  rules:
    - if: '$CI_COMMIT_TAG'

# Repair metadata for an already-built tag without moving the tag or
# republishing immutable package artifacts. Run a pipeline on main with
# RELEASE_TAG=0.2.0 (or the required existing version).
repair_release:
  stage: release
  image: composer:2
  before_script: []
  needs: []
  script:
    - php bin/publish-release.php
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_TAG'
      when: manual

vscode_build:
  stage: build
  image: node:22-bookworm
  before_script: []
  script:
    - cd vscode
    - npm ci --no-audit --no-fund
    - npm test
    # Tag builds align the VS Code package with the release tag; branch builds keep their development version.
    - 'if [ -n "${CI_COMMIT_TAG:-}" ]; then npm version "$CI_COMMIT_TAG" --no-git-tag-version; fi'
    - VSIX_VERSION=$(node -p 'require("./package.json").version')
    - npm run bundle-core
    - ./node_modules/.bin/vsce ls --no-dependencies | tee package-files.txt
    - grep -F 'dist/native-worker.js' package-files.txt
    - grep -F 'core/bin/sem-ide' package-files.txt
    - grep -F 'core/src/Autoload.php' package-files.txt
    - grep -F 'src/extension.js' package-files.txt
    - grep -F 'src/navigation.js' package-files.txt
    - ./node_modules/.bin/vsce package --no-dependencies
    - 'test -s "small-entity-manager-vscode-${VSIX_VERSION}.vsix"'
    - 'ls -lh "small-entity-manager-vscode-${VSIX_VERSION}.vsix"'
  artifacts:
    when: always
    paths:
      - vscode/*.vsix
      - vscode/package-files.txt
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID || $CI_COMMIT_TAG'

